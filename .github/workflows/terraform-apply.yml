name: Terraform Apply

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement à déployer (dev ou prd)"
        required: true
        type: choice
        options: [dev, prd]
        default: "dev"
      confirmation:
        description: 'Tapez "DEPLOY" pour lancer terraform apply manuellement'
        required: true
        default: "NO"

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  tests:
    name: API Tests
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt
          pip install pre-commit

      - name: Run pre-commit checks
        run: pre-commit run --all-files

      - name: Run API tests
        run: python -m pytest app/tests

  cleanup_dev:
    name: Cleanup Namespaces (dev)
    environment: dev
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    needs: tests
    # GCP jobs only run once the repository is connected to a GCP project.
    if: vars.GCP_DEPLOY_ENABLED == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_DEV }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_DEV }}

      - name: Ensure kubectl access (dev)
        run: |
          gcloud config set project ${{ secrets.GCP_PROJECT_DEV }}
          gcloud container clusters get-credentials tasks-cluster --zone europe-west9-b --project ${{ secrets.GCP_PROJECT_DEV }}

      - name: Remove namespace finalizers
        shell: bash
        run: |
          set +e
          for ns in dev dev-monitoring; do
            if kubectl get namespace "$ns" >/dev/null 2>&1; then
              # Only force-finalize namespaces stuck in deletion; never touch active ones.
              if [ "$(kubectl get namespace "$ns" -o jsonpath='{.status.phase}' 2>/dev/null)" = "Terminating" ]; then
                echo "Removing finalizers from stuck namespace $ns"
                kubectl get namespace "$ns" -o json | jq 'del(.spec.finalizers)' > /tmp/$ns.json
                kubectl replace --raw "/api/v1/namespaces/$ns/finalize" -f /tmp/$ns.json || true
              fi
            fi
          done
          set -e
  cleanup_prd:
    name: Cleanup Namespaces (prd)
    environment: prd
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    needs: tests
    # GCP jobs only run once the repository is connected to a GCP project.
    if: vars.GCP_DEPLOY_ENABLED == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_PRD }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_PRD }}

      - name: Ensure kubectl access
        run: |
          gcloud config set project ${{ secrets.GCP_PROJECT_PRD }}
          gcloud container clusters get-credentials tasks-cluster --zone europe-west1-b --project ${{ secrets.GCP_PROJECT_PRD }}

      - name: Remove namespace finalizers
        shell: bash
        run: |
          set +e
          for ns in prd prd-monitoring; do
            if kubectl get namespace "$ns" >/dev/null 2>&1; then
              # Only force-finalize namespaces stuck in deletion; never touch active ones.
              if [ "$(kubectl get namespace "$ns" -o jsonpath='{.status.phase}' 2>/dev/null)" = "Terminating" ]; then
                echo "Removing finalizers from stuck namespace $ns"
                kubectl get namespace "$ns" -o json | jq 'del(.spec.finalizers)' > /tmp/$ns.json
                kubectl replace --raw "/api/v1/namespaces/$ns/finalize" -f /tmp/$ns.json || true
              fi
            fi
          done
          set -e

  deploy_dev:
    name: Apply Dev
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    environment: dev
    needs: cleanup_dev
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    env:
      TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
      TF_VAR_app_secret_key: ${{ secrets.TF_VAR_app_secret_key }}
    steps:
      - name: Skip dev apply pour une exécution prod manuelle
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prd'
        run: echo "Déploiement dev ignoré (workflow déclenché pour prod)."

      - name: Vérifier la confirmation (manuel)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev'
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "DEPLOY" ]; then
            echo "Vous devez saisir DEPLOY pour exécuter ce workflow."
            exit 1
          fi

      - name: Checkout repository
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
        uses: actions/checkout@v4

      - name: Setup Terraform
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
        uses: hashicorp/setup-terraform@v3

      - name: Authenticate to Google Cloud (dev)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_DEV }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_DEV }}

      - name: Set gcloud project (dev)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
        run: gcloud config set project ${{ secrets.GCP_PROJECT_DEV }}

      - name: Terraform plan & apply (dev) - iam, bootstrap, db
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
        run: |
          set -euo pipefail
          for module in iam bootstrap db; do
            echo "::group::Terraform dev - ${module}"
            scripts/tf-plan-apply.sh "${module}" dev
            echo "::endgroup::"
          done

      - name: Build and push API image (dev)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
        run: |
          set -euo pipefail
          IMAGE="$(terraform -chdir=terraform/bootstrap output -raw image_repository)"
          gcloud auth configure-docker "${IMAGE%%/*}" --quiet
          docker build -t "${IMAGE}:${GITHUB_SHA}" app
          docker push "${IMAGE}:${GITHUB_SHA}"
          echo "TF_VAR_image_repository=${IMAGE}" >> "$GITHUB_ENV"
          echo "TF_VAR_image_tag=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Terraform plan & apply (dev) - cluster, dns
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
        run: |
          set -euo pipefail
          for module in cluster dns; do
            echo "::group::Terraform dev - ${module}"
            scripts/tf-plan-apply.sh "${module}" dev
            echo "::endgroup::"
          done

  deploy_prd:
    name: Apply Prod
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    environment: prd
    needs: [tests, cleanup_prd, deploy_dev]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prd')
    env:
      TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
      TF_VAR_app_secret_key: ${{ secrets.TF_VAR_app_secret_key }}
    steps:
      - name: Vérifier la confirmation (manuel)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "DEPLOY" ]; then
            echo "Vous devez saisir DEPLOY pour exécuter ce workflow."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Authenticate to Google Cloud (prd)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_PRD }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_PRD }}

      - name: Set gcloud project (prd)
        run: gcloud config set project ${{ secrets.GCP_PROJECT_PRD }}

      - name: Terraform plan & apply (prd) - iam, bootstrap, db
        run: |
          set -euo pipefail
          for module in iam bootstrap db; do
            echo "::group::Terraform prd - ${module}"
            scripts/tf-plan-apply.sh "${module}" prd
            echo "::endgroup::"
          done

      - name: Build and push API image (prd)
        run: |
          set -euo pipefail
          IMAGE="$(terraform -chdir=terraform/bootstrap output -raw image_repository)"
          gcloud auth configure-docker "${IMAGE%%/*}" --quiet
          docker build -t "${IMAGE}:${GITHUB_SHA}" app
          docker push "${IMAGE}:${GITHUB_SHA}"
          echo "TF_VAR_image_repository=${IMAGE}" >> "$GITHUB_ENV"
          echo "TF_VAR_image_tag=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Terraform plan & apply (prd) - cluster, dns
        run: |
          set -euo pipefail
          for module in cluster dns; do
            echo "::group::Terraform prd - ${module}"
            scripts/tf-plan-apply.sh "${module}" prd
            echo "::endgroup::"
          done
