name: Terraform Apply

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement à déployer (dev ou prd)"
        required: true
        default: "dev"
      confirmation:
        description: 'Tapez "DEPLOY" pour lancer terraform apply manuellement'
        required: true
        default: "NO"

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  tests:
    name: API Tests
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt
          pip install pre-commit

      - name: Run pre-commit checks
        run: pre-commit run --all-files

      - name: Run API tests
        run: python -m pytest app/tests

  deploy_dev:
    name: Apply Dev
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    environment: dev
    needs: tests
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    env:
      TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
    steps:
      - name: Skip dev apply pour une exécution prod manuelle
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prd'
        run: echo "Déploiement dev ignoré (workflow déclenché pour prod)."

      - name: Vérifier la confirmation (manuel)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev'
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "DEPLOY" ]; then
            echo "Vous devez saisir DEPLOY pour exécuter ce workflow."
            exit 1
          fi

      - name: Checkout repository
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
        uses: actions/checkout@v4

      - name: Setup Terraform
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
        uses: hashicorp/setup-terraform@v2

      - name: Authenticate to Google Cloud (dev)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_DEV }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_DEV }}

      - name: Set gcloud project (dev)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
        run: gcloud config set project ${{ secrets.GCP_PROJECT_DEV }}

      - name: Terraform apply (dev)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
        run: |
          set -euo pipefail
          for module in bootstrap iam db cluster dns; do
            echo "::group::Terraform apply dev - ${module}"
            terraform -chdir=terraform/${module} init -input=false -backend-config=backends/backend-dev.hcl
            terraform -chdir=terraform/${module} apply -input=false -auto-approve -var-file=../environments/dev/${module}.tfvars
            echo "::endgroup::"
          done

  deploy_prd:
    name: Apply Prod
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    environment: prd
    needs: [tests, deploy_dev]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prd')
    env:
      TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
    steps:
      - name: Vérifier la confirmation (manuel)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "DEPLOY" ]; then
            echo "Vous devez saisir DEPLOY pour exécuter ce workflow."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Authenticate to Google Cloud (prd)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_PRD }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_PRD }}

      - name: Set gcloud project (prd)
        run: gcloud config set project ${{ secrets.GCP_PROJECT_PRD }}

      - name: Terraform apply (prd)
        run: |
          set -euo pipefail
          for module in bootstrap iam db cluster dns; do
            echo "::group::Terraform apply prd - ${module}"
            terraform -chdir=terraform/${module} init -input=false -backend-config=backends/backend-prd.hcl
            terraform -chdir=terraform/${module} apply -input=false -auto-approve -var-file=../environments/prd/${module}.tfvars
            echo "::endgroup::"
          done
