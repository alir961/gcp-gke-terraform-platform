name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement à détruire (dev ou prd)"
        required: true
        default: "dev"
      confirmation:
        description: 'Tapez "DESTROY" pour confirmer la destruction Terraform'
        required: true
        default: "NO"
      destroy_bootstrap:
        description: "Inclure le module bootstrap (supprime le bucket de state) ? true/false"
        required: false
        default: "false"

permissions:
  contents: read
  id-token: write

jobs:
  guard:
    name: Vérification manuelle
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Vérifier la confirmation
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "DESTROY" ]; then
            echo "Vous devez saisir DESTROY pour lancer la destruction."
            exit 1
          fi
      - name: Vérifier l'environnement
        run: |
          if [ "${{ github.event.inputs.environment }}" != "dev" ] && [ "${{ github.event.inputs.environment }}" != "prd" ]; then
            echo "L'environnement doit être dev ou prd."
            exit 1
          fi
      - name: Vérifier destroy_bootstrap
        run: |
          if [ "${{ github.event.inputs.destroy_bootstrap }}" != "true" ] && [ "${{ github.event.inputs.destroy_bootstrap }}" != "false" ] && [ -n "${{ github.event.inputs.destroy_bootstrap }}" ]; then
            echo "destroy_bootstrap doit valoir true ou false."
            exit 1
          fi

  cleanup_before_destroy:
    name: Cleanup Namespaces Before Destroy
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    environment: ${{ github.event.inputs.environment }}
    needs: guard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ github.event.inputs.environment == 'dev' && secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_DEV || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_PRD }}
          service_account: ${{ github.event.inputs.environment == 'dev' && secrets.GCP_SERVICE_ACCOUNT_DEV || secrets.GCP_SERVICE_ACCOUNT_PRD }}

      - name: Configure kubectl
        run: |
          if [ "${{ github.event.inputs.environment }}" = "dev" ]; then
            gcloud config set project ${{ secrets.GCP_PROJECT_DEV }}
            gcloud container clusters get-credentials tasks-cluster --zone europe-west9-b --project ${{ secrets.GCP_PROJECT_DEV }}
          else
            gcloud config set project ${{ secrets.GCP_PROJECT_PRD }}
            gcloud container clusters get-credentials tasks-cluster --zone europe-west1-b --project ${{ secrets.GCP_PROJECT_PRD }}
          fi

      - name: Remove namespace finalizers
        shell: bash
        run: |
          set +e
          if [ "${{ github.event.inputs.environment }}" = "dev" ]; then
            namespaces=(dev dev-monitoring)
          else
            namespaces=(prd prd-monitoring)
          fi

          for ns in "${namespaces[@]}"; do
            if kubectl get namespace "$ns" >/dev/null 2>&1; then
              if kubectl get namespace "$ns" -o jsonpath='{.spec.finalizers}' 2>/dev/null | grep -q 'kubernetes'; then
                echo "Removing finalizers from namespace $ns"
                kubectl get namespace "$ns" -o json | jq 'del(.spec.finalizers)' > /tmp/$ns.json
                kubectl replace --raw "/api/v1/namespaces/$ns/finalize" -f /tmp/$ns.json || true
              fi
            fi
          done
          set -e

  destroy:
    name: Terraform Destroy
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    needs: [guard, cleanup_before_destroy]
    environment: ${{ github.event.inputs.environment }}
    env:
      TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
      TF_VAR_app_secret_key: ${{ secrets.TF_VAR_app_secret_key }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Authentification GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ github.event.inputs.environment == 'dev' && secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_DEV || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_PRD }}
          service_account: ${{ github.event.inputs.environment == 'dev' && secrets.GCP_SERVICE_ACCOUNT_DEV || secrets.GCP_SERVICE_ACCOUNT_PRD }}

      - name: Définir le projet GCP
        run: |
          if [ "${{ github.event.inputs.environment }}" = "dev" ]; then
            gcloud config set project ${{ secrets.GCP_PROJECT_DEV }}
          else
            gcloud config set project ${{ secrets.GCP_PROJECT_PRD }}
          fi

      - name: Supprimer base et utilisateur Cloud SQL
        run: |
          if [ "${{ github.event.inputs.environment }}" = "dev" ]; then
            PROJECT=${{ secrets.GCP_PROJECT_DEV }}
          else
            PROJECT=${{ secrets.GCP_PROJECT_PRD }}
          fi
          gcloud config set project "${PROJECT}"
          # Supprime la base et l'utilisateur s'ils existent déjà pour éviter les dépendances
          gcloud sql databases delete tasks_db --instance tasks-db --quiet || true
          gcloud sql users delete tasks_user --instance tasks-db --quiet || true

      - name: Terraform destroy
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.environment }}" = "dev" ]; then
            BACKEND=backends/backend-dev.hcl
            TFVARS_DIR=../environments/dev
          else
            BACKEND=backends/backend-prd.hcl
            TFVARS_DIR=../environments/prd
          fi

          for module in dns cluster db iam; do
            echo "::group::Terraform destroy ${{ github.event.inputs.environment }} - ${module}"
            terraform -chdir=terraform/${module} init -input=false -backend-config=${BACKEND}
            terraform -chdir=terraform/${module} destroy -input=false -auto-approve -var-file=${TFVARS_DIR}/${module}.tfvars
            echo "::endgroup::"
          done

          if [ "${{ github.event.inputs.destroy_bootstrap }}" = "true" ]; then
            echo "::group::Terraform destroy ${{ github.event.inputs.environment }} - bootstrap"
            terraform -chdir=terraform/bootstrap init -input=false -backend-config=${BACKEND}
            terraform -chdir=terraform/bootstrap destroy -input=false -auto-approve -var-file=${TFVARS_DIR}/bootstrap.tfvars
            echo "::endgroup::"
          else
            echo "Module bootstrap conservé (bucket de state préservé)."
          fi

  cleanup_after_destroy:
    if: always()
    name: Cleanup Namespaces After Destroy
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    environment: ${{ github.event.inputs.environment }}
    needs: destroy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ github.event.inputs.environment == 'dev' && secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_DEV || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_PRD }}
          service_account: ${{ github.event.inputs.environment == 'dev' && secrets.GCP_SERVICE_ACCOUNT_DEV || secrets.GCP_SERVICE_ACCOUNT_PRD }}

      - name: Remove namespace finalizers
        shell: bash
        run: |
          set +e
          if [ "${{ github.event.inputs.environment }}" = "dev" ]; then
            PROJECT=${{ secrets.GCP_PROJECT_DEV }}
            ZONE=europe-west9-b
            namespaces=(dev dev-monitoring)
          else
            PROJECT=${{ secrets.GCP_PROJECT_PRD }}
            ZONE=europe-west1-b
            namespaces=(prd prd-monitoring)
          fi

          gcloud config set project "${PROJECT}"
          if ! gcloud container clusters get-credentials tasks-cluster --zone "${ZONE}" --project "${PROJECT}"; then
            echo "Cluster indisponible (${PROJECT}), aucune suppression de namespace nécessaire."
            exit 0
          fi

          for ns in "${namespaces[@]}"; do
            if kubectl get namespace "$ns" --request-timeout=5s >/dev/null 2>&1; then
              if kubectl get namespace "$ns" -o jsonpath='{.spec.finalizers}' --request-timeout=5s 2>/dev/null | grep -q 'kubernetes'; then
                echo "Removing finalizers from namespace $ns"
                kubectl get namespace "$ns" -o json --request-timeout=5s | jq 'del(.spec.finalizers)' > /tmp/$ns.json
                kubectl replace --raw "/api/v1/namespaces/$ns/finalize" -f /tmp/$ns.json || true
              fi
            fi
          done
