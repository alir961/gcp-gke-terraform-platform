name: Terraform Plan

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement à planifier (dev ou prd)"
        required: false
        default: "both"

permissions:
  contents: read
  id-token: write

jobs:
  fmt_validate:
    name: Format & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform fmt (modules)
        run: |
          terraform -chdir=terraform/bootstrap fmt -check
          terraform -chdir=terraform/cluster fmt -check
          terraform -chdir=terraform/db fmt -check
          terraform -chdir=terraform/iam fmt -check

      - name: Terraform init & validate (modules)
        run: |
          terraform -chdir=terraform/bootstrap init -backend=false -input=false
          terraform -chdir=terraform/bootstrap validate -no-color
          terraform -chdir=terraform/cluster init -backend=false -input=false
          terraform -chdir=terraform/cluster validate -no-color
          terraform -chdir=terraform/db init -backend=false -input=false
          terraform -chdir=terraform/db validate -no-color
          terraform -chdir=terraform/iam init -backend=false -input=false
          terraform -chdir=terraform/iam validate -no-color

  plan:
    name: Terraform Plan (${{ matrix.environment }})
    needs: fmt_validate
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.environment == 'both' || github.event.inputs.environment == matrix.environment))
    environment: ${{ matrix.environment }}
    env:
      TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ matrix.environment == 'dev' && secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_DEV || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_PRD }}
      GCP_SERVICE_ACCOUNT: ${{ matrix.environment == 'dev' && secrets.GCP_SERVICE_ACCOUNT_DEV || secrets.GCP_SERVICE_ACCOUNT_PRD }}
      GCP_PROJECT: ${{ matrix.environment == 'dev' && secrets.GCP_PROJECT_DEV || secrets.GCP_PROJECT_PRD }}
      TF_BACKEND_FILE: ${{ matrix.environment == 'dev' && 'backends/backend-dev.hcl' || 'backends/backend-prd.hcl' }}
      TFVARS_DIR: ${{ matrix.environment == 'dev' && '../environments/dev' || '../environments/prd' }}
      TFPLAN_NAME: ${{ matrix.environment == 'dev' && 'tfplan-dev' || 'tfplan-prd' }}
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prd]
        module: [bootstrap, cluster, db, iam]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set gcloud project
        run: gcloud config set project ${{ env.GCP_PROJECT }}

      - name: Terraform init (${{ matrix.environment }})
        run: terraform -chdir=terraform/${{ matrix.module }} init -input=false -backend-config=${{ env.TF_BACKEND_FILE }}

      - name: Terraform plan (${{ matrix.environment }})
        run: terraform -chdir=terraform/${{ matrix.module }} plan -input=false -no-color -var-file=${{ env.TFVARS_DIR }}/${{ matrix.module }}.tfvars -out=${{ env.TFPLAN_NAME }}

      - name: Upload plan artifact (${{ matrix.environment }})
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ matrix.environment }}-${{ matrix.module }}
          path: terraform/${{ matrix.module }}/${{ env.TFPLAN_NAME }}
