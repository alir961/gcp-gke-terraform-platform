replicaCount: 2

image:
  repository: redis
  tag: 7.2.5-alpine
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 6379

persistence:
  enabled: false # activer + configurer une StorageClass si besoin

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 300m
    memory: 512Mi
