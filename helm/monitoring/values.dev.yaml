alertmanager:
  enabled: false
  resources:
    requests:
      cpu: 25m
      memory: 48Mi
    limits:
      cpu: 80m
      memory: 96Mi

grafana:
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 40m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 192Mi
  persistence:
    enabled: false

prometheus:
  prometheusSpec:
    retention: 24h
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    podMonitorSelector: {}
    ruleSelector: {}
    serviceMonitorNamespaceSelector: {}
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        cpu: 250m
        memory: 768Mi
