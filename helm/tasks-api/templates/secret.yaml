{{- if .Values.secret.create }}
{{- $dbPassword := required "app.db.password is required when secret.create is true" .Values.app.db.password -}}
{{- $secretKey := required "app.secretKey is required when secret.create is true" .Values.app.secretKey -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tasks-api.secretName" . }}
  labels:
    {{- include "tasks-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASS: {{ $dbPassword | quote }}
  SECRET_KEY: {{ $secretKey | quote }}
{{- end }}
