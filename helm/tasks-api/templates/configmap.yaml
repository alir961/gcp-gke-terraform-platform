{{- $dbHost := required "app.db.host is required" .Values.app.db.host -}}
{{- $dbUser := required "app.db.user is required" .Values.app.db.user -}}
{{- $redisUrl := "" -}}
{{- if .Values.redis.enabled }}
  {{- $serviceName := printf "%s-redis" (include "tasks-api.fullname" .) -}}
  {{- $redisUrl = printf "redis://%s.%s.svc.cluster.local:%d" $serviceName .Release.Namespace (int .Values.redis.service.port) -}}
{{- else if .Values.redis.externalUrl }}
  {{- $redisUrl = .Values.redis.externalUrl -}}
{{- else if .Values.app.redisUrl }}
  {{- $redisUrl = .Values.app.redisUrl -}}
{{- else }}
  {{- fail "Redis is disabled; provide redis.externalUrl or app.redisUrl" -}}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tasks-api.configMapName" . }}
  labels:
    {{- include "tasks-api.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.app.environment | quote }}
  DB_HOST: {{ $dbHost | quote }}
  DB_PORT: "{{ .Values.app.db.port }}"
  DB_NAME: {{ .Values.app.db.name | quote }}
  DB_USER: {{ $dbUser | quote }}
  REDIS_URL: {{ $redisUrl | quote }}
