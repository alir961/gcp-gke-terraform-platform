apiVersion: v1
kind: Service
metadata:
  name: {{ include "tasks-api.fullname" . }}
  labels:
    {{- include "tasks-api.labels" . | nindent 4 }}
  {{- if or .Values.service.annotations .Values.backendConfig.enabled }}
  annotations:
    {{- with .Values.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.backendConfig.enabled }}
    cloud.google.com/backend-config: '{"default": "{{ include "tasks-api.fullname" . }}"}'
    {{- end }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "tasks-api.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
