image:
  repository: europe-west1-docker.pkg.dev/example-project-prd/tasks-registry/tasks-api
  tag: latest
  pullPolicy: IfNotPresent

app:
  environment: prod
  containerPort: 8080
  livenessPath: /status
  readinessPath: /status
  redisUrl: ""
  db:
    host: "10.148.0.3"
    port: 5432
    name: tasks_db
    user: tasks_user

secret:
  create: false
  nameOverride: tasks-api-secret

serviceAccount:
  create: true
  name: tasks-api-sa

rbac:
  create: false

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations:
    cloud.google.com/neg: '{"ingress": true}'

redis:
  enabled: true
  replicaCount: 2
  image:
    repository: redis
    tag: 7.2.5-alpine
    pullPolicy: IfNotPresent
  externalUrl: ""
  service:
    type: ClusterIP
    port: 6379
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

backendConfig:
  enabled: true
  healthCheck:
    requestPath: /status
    port: 8080

prometheus:
  enabled: true
  path: /status
  port: "8080"
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    labels:
      release: monitoring

ingress:
  enabled: true
  host: api.example-project.com
  staticIpName: tasks-ingress-ip
  managedCertificateName: tasks-api-cert-prod
  allowHttp: false
  annotations: {}



replicaCount: 3

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 15
  targetCPUUtilizationPercentage: 60

resources:
  requests:
    cpu: "250m"
    memory: 512Mi
  limits:
    cpu: "500m"
    memory: 1Gi
