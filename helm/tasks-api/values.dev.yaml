image:
  repository: europe-west1-docker.pkg.dev/example-project-dev/tasks-registry/tasks-api
  tag: latest

app:
  environment: dev
  containerPort: 8080
  livenessPath: /status
  readinessPath: /status
  redisUrl: redis://tasks-redis.dev.svc.cluster.local:6379
  db:
    host: "10.41.0.3"
    port: 5432
    name: tasks_db
    user: tasks_user

secret:
  create: false
  nameOverride: tasks-api-secret

serviceAccount:
  create: false
  name: tasks-api-sa

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
