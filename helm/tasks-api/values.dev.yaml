image:
  repository: europe-west1-docker.pkg.dev/example-project-dev/tasks-registry/tasks-api
  tag: latest
  # A mutable tag needs Always, or nodes keep running the image they pulled first.
  pullPolicy: Always

app:
  environment: dev
  containerPort: 8080
  livenessPath: /status
  readinessPath: /status
  redisUrl: ""
  db:
    host: "10.17.0.3"
    port: 5432
    name: tasks_db
    user: tasks_user

secret:
  create: false
  nameOverride: tasks-api-secret

serviceAccount:
  create: true
  name: tasks-api-sa

rbac:
  create: false

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations:
    cloud.google.com/neg: '{"ingress": true}'

redis:
  enabled: true
  replicaCount: 1
  image:
    repository: redis
    tag: 7.2.5-alpine
    pullPolicy: IfNotPresent
  externalUrl: ""
  service:
    type: ClusterIP
    port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

backendConfig:
  enabled: true
  healthCheck:
    requestPath: /status
    port: 8080

prometheus:
  enabled: true
  path: /metrics
  port: "8080"
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    labels:
      release: monitoring

ingress:
  enabled: true
  host: api.dev.example-project.com
  staticIpName: tasks-ingress-ip-dev
  managedCertificateName: tasks-api-cert-dev
  allowHttp: false
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: "250m"
    memory: 512Mi
  limits:
    cpu: "500m"
    memory: 1Gi
