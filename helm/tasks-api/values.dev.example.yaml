image:
  repository: europe-west1-docker.pkg.dev/example-project-dev/tasks-registry/tasks-api
  tag: latest

app:
  environment: dev
  containerPort: 8080
  livenessPath: /status
  readinessPath: /status
  redisUrl: ""
  secretKey: "<dev-secret-key>"
  db:
    host: "<cloudsql-private-ip>"
    port: 5432
    name: tasks_db
    user: tasks_user

secret:
  create: false
  nameOverride: tasks-api-secret

serviceAccount:
  create: false
  name: tasks-api-sa

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations:
    cloud.google.com/neg: '{"ingress": true}'

redis:
  enabled: true
  replicaCount: 1
  image:
    repository: redis
    tag: 7.2.5-alpine
    pullPolicy: IfNotPresent
  externalUrl: ""
  service:
    type: ClusterIP
    port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

backendConfig:
  enabled: true
  healthCheck:
    requestPath: /status
    port: 8080

prometheus:
  enabled: true
  path: /status
  port: "8080"

ingress:
  enabled: true
  host: api.dev.example.com
  staticIpName: tasks-ingress-ip-dev
  managedCertificateName: tasks-api-cert-dev
  allowHttp: false
  annotations: {}



replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: "1"
    memory: 1Gi
  limits:
    cpu: "1"
    memory: 1Gi
